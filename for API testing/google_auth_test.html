<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Google ID Token Test</title>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: #020617;
            padding: 24px;
            border-radius: 12px;
            width: 700px;
        }
        textarea {
            width: 100%;
            height: 220px;
            margin-top: 16px;
            background: #020617;
            color: #22c55e;
            border: 1px solid #334155;
            padding: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Google ID Token test</h2>

    <div id="g_id_onload"
         data-client_id="{{ GOOGLE_CLIENT_ID }}"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="g_id_signin"></div>

    <textarea id="token" placeholder="ID TOKEN появится здесь"></textarea>
</div>

<script>
    function handleCredentialResponse(response) {
        console.log("ID TOKEN:", response.credential);
        document.getElementById("token").value = response.credential;
    }
</script>

</body>
</html>
